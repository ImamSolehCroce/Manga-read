<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MangaStory - Pembaca Manga AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .mood-btn.active { background-color: #84cc16; color: #0f172a; border-color: #84cc16; }
        .mood-btn { border: 2px solid #334155; color: #94a3b8; transition: all 0.3s ease; }
    </style>
</head>
<body class="p-4 md:p-8 max-w-3xl mx-auto">

    <div class="flex items-center gap-3 mb-8">
        <div class="bg-lime-500 text-slate-900 p-2 rounded-lg font-bold text-xl">📖</div>
        <div>
            <h1 class="text-2xl font-bold text-white">MangaStory</h1>
            <p class="text-sm text-slate-400">Ubah Panel Manga Menjadi Cerita</p>
        </div>
    </div>

    <!-- Konfigurasi API -->
    <div class="bg-slate-800 p-5 rounded-xl mb-6 border border-slate-700 shadow-lg">
        <h2 class="text-lime-400 font-bold text-sm tracking-wider mb-4 flex items-center gap-2">
            <span>🔑</span> MANAJEMEN API KEY
        </h2>
        
        <div class="flex gap-2 mb-3">
            <input type="password" id="apiKeyInput" placeholder="Masukkan API Key di sini..." class="flex-1 bg-slate-900 text-white border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-lime-500">
            <button onclick="addApiKey()" class="bg-lime-500 hover:bg-lime-400 text-slate-900 font-bold px-4 py-2 rounded-lg text-sm transition-all">Tambah</button>
            <button onclick="checkApiKey()" class="bg-blue-500 hover:bg-blue-400 text-white font-bold px-4 py-2 rounded-lg text-sm transition-all">Uji Key</button>
        </div>
        
        <ul id="apiKeyList" class="space-y-2 mt-4"></ul>
        <p class="text-[11px] text-slate-500 mt-3">*Gunakan tombol "Uji Key" untuk memastikan API Key Anda tidak diblokir oleh Google.</p>
    </div>

    <!-- Konfigurasi Cerita -->
    <div class="bg-slate-800 p-5 rounded-xl mb-6 border border-slate-700 shadow-lg">
        <h2 class="text-lime-400 font-bold text-sm tracking-wider mb-4 flex items-center gap-2">
            <span>⚡</span> KONFIGURASI CERITA
        </h2>
        
        <label class="block text-xs font-semibold text-slate-400 mb-2">PILIH NUANSA CERITA</label>
        <div class="grid grid-cols-3 gap-3 mb-6" id="moodContainer">
            <button onclick="setMood('Senang', this)" class="mood-btn active rounded-lg p-3 font-semibold text-sm">😄 Senang</button>
            <button onclick="setMood('Sedih', this)" class="mood-btn rounded-lg p-3 font-semibold text-sm">😢 Sedih</button>
            <button onclick="setMood('Semangat', this)" class="mood-btn rounded-lg p-3 font-semibold text-sm">🔥 Semangat</button>
        </div>

        <label class="block text-xs font-semibold text-slate-400 mb-2">PANEL GAMBAR KOMIK</label>
        <div id="imageContainer" class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-4"></div>
        
        <label class="cursor-pointer bg-slate-700 hover:bg-slate-600 text-white border border-slate-600 border-dashed rounded-lg p-4 flex flex-col items-center justify-center gap-2 transition-all">
            <span class="text-2xl">+</span>
            <span class="text-sm">Tambah Gambar</span>
            <input type="file" id="imageInput" accept="image/*" class="hidden" multiple onchange="handleImageUpload(event)">
        </label>
    </div>

    <button id="generateBtn" onclick="generateStory()" class="w-full bg-lime-500 hover:bg-lime-400 text-slate-900 font-bold text-sm tracking-wide p-4 rounded-xl shadow-lg transition-all mb-6">
        🪄 GENERATE CERITA SEKARANG
    </button>

    <div id="outputSection" class="hidden bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg mb-6">
        <h2 class="text-lime-400 font-bold text-sm tracking-wider mb-4 flex items-center gap-2">
            <span>✨</span> HASIL / LOG INFO
        </h2>
        <div id="loading" class="hidden text-center text-slate-400 text-sm p-4">
            Memproses ke server Google... Mohon tunggu.
        </div>
        <div id="resultText" class="text-slate-200 text-sm leading-relaxed space-y-4 break-words"></div>
    </div>

    <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg mb-10">
        <h2 class="text-lime-400 font-bold text-sm tracking-wider mb-4 flex items-center gap-2">
            <span>📚</span> RIWAYAT CERITA
        </h2>
        <div id="historyList" class="space-y-4"></div>
    </div>

    <script>
        let currentMood = 'Senang';
        let imagesData = [];
        let apiKeys = [];
        let storyHistory = [];

        const allGeminiModels = [
            'gemini-1.5-flash', 
            'gemini-1.5-flash-latest', 
            'gemini-1.5-pro', 
            'gemini-1.5-pro-latest'
        ];

        window.onload = () => {
            loadData();
            renderApiKeys();
            renderHistory();
        };

        function loadData() {
            const savedKeys = localStorage.getItem('mangaApiKeys');
            if (savedKeys) apiKeys = JSON.parse(savedKeys);
            const savedHistory = localStorage.getItem('mangaHistory');
            if (savedHistory) storyHistory = JSON.parse(savedHistory);
        }

        function saveData() {
            localStorage.setItem('mangaApiKeys', JSON.stringify(apiKeys));
            localStorage.setItem('mangaHistory', JSON.stringify(storyHistory));
        }

        function addApiKey() {
            const input = document.getElementById('apiKeyInput');
            const key = input.value.trim();
            if (!key) return;
            apiKeys.push(key);
            saveData();
            renderApiKeys();
            input.value = '';
        }

        function removeApiKey(index) {
            apiKeys.splice(index, 1);
            saveData();
            renderApiKeys();
        }

        function renderApiKeys() {
            const list = document.getElementById('apiKeyList');
            list.innerHTML = '';
            if (apiKeys.length === 0) {
                list.innerHTML = '<li class="text-xs text-slate-500 italic">Belum ada API Key yang tersimpan.</li>';
                return;
            }
            apiKeys.forEach((key, index) => {
                const li = document.createElement('li');
                li.className = "flex justify-between items-center bg-slate-900 p-3 rounded-lg border border-slate-700 text-sm";
                const maskedKey = key.substring(0, 8) + '••••••••' + key.substring(key.length - 4);
                li.innerHTML = `
                    <span class="text-slate-300 font-mono">🔑 API Key ${index + 1} <span class="text-slate-500 text-xs ml-2">(${maskedKey})</span></span>
                    <button onclick="removeApiKey(${index})" class="bg-red-500 hover:bg-red-600 text-white font-bold w-6 h-6 flex items-center justify-center rounded-md transition-all text-xs">✕</button>
                `;
                list.appendChild(li);
            });
        }

        async function checkApiKey() {
            if (apiKeys.length === 0) return alert("Silakan tambah API Key ke dalam daftar terlebih dahulu!");
            
            const keyToTest = apiKeys[0]; // Test API Key pertama di daftar
            const resultText = document.getElementById('resultText');
            const outputSection = document.getElementById('outputSection');
            
            outputSection.classList.remove('hidden');
            resultText.innerHTML = `<span class="text-blue-400 font-semibold animate-pulse">Sedang memeriksa daftar model yang diizinkan oleh Google...</span>`;
            
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${keyToTest}`);
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error?.message || "Gagal memeriksa key.");
                }
                
                const modelNames = data.models.map(m => m.name).filter(name => name.includes('gemini'));
                resultText.innerHTML = `<div class="p-4 bg-blue-900/50 text-blue-200 border border-blue-800 rounded-lg text-sm shadow-md">
                    <strong class="text-blue-400 text-lg mb-2 block">✅ API Key Anda Valid dan Aktif!</strong>
                    Model yang bisa Anda gunakan dengan Key ini:<br>
                    <ul class="list-disc ml-5 mt-2 space-y-1">${modelNames.map(m => `<li><code class="text-blue-300">${m}</code></li>`).join('')}</ul>
                    <div class="mt-4 text-xs text-blue-400/70">*Jika ada 'models/gemini-1.5-flash', berarti siap dipakai Generate.</div>
                </div>`;
            } catch (error) {
                resultText.innerHTML = `<div class="p-4 bg-red-900/50 text-red-200 border border-red-800 rounded-lg text-sm shadow-md">
                    <strong class="text-red-400 text-lg mb-2 block">❌ API Key Bermasalah!</strong>
                    Penjelasan Google: <em>${error.message}</em><br><br>
                    <strong>Solusi:</strong> Buat API Key baru di AI Studio, pastikan memilih opsi "Create API key in new project".
                </div>`;
            }
        }

        function addHistory(storyText, usedModel) {
            const newItem = {
                id: Date.now(),
                date: new Date().toLocaleString('id-ID'),
                mood: currentMood,
                model: usedModel,
                imagesCount: imagesData.length,
                text: storyText
            };
            storyHistory.unshift(newItem);
            saveData();
            renderHistory();
        }

        function deleteHistory(id) {
            storyHistory = storyHistory.filter(item => item.id !== id);
            saveData();
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            if (storyHistory.length === 0) {
                list.innerHTML = '<div class="text-xs text-slate-500 italic text-center py-4">Riwayat cerita masih kosong.</div>';
                return;
            }
            storyHistory.forEach(item => {
                const div = document.createElement('div');
                div.className = "bg-slate-900 p-4 rounded-lg border border-slate-700 relative";
                div.innerHTML = `
                    <button onclick="deleteHistory(${item.id})" class="absolute top-3 right-3 text-red-400 hover:text-red-300 font-bold p-1 text-sm">Hapus</button>
                    <div class="flex gap-2 text-xs text-slate-500 mb-3 border-b border-slate-800 pb-2">
                        <span>🕒 ${item.date}</span><span>|</span><span>🎭 ${item.mood}</span><span>|</span><span>🖼️ ${item.imagesCount} Gambar</span><span>|</span><span class="text-lime-500/70">⚙️ ${item.model}</span>
                    </div>
                    <div class="text-slate-300 text-sm leading-relaxed">${item.text.replace(/\n/g, '<br><br>')}</div>
                `;
                list.appendChild(div);
            });
        }

        function setMood(mood, element) {
            currentMood = mood;
            document.querySelectorAll('.mood-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }

        async function handleImageUpload(event) {
            const files = event.target.files;
            for (let file of files) {
                const base64Data = await convertToBase64(file);
                imagesData.push({
                    mimeType: file.type || 'image/jpeg',
                    data: base64Data.split(',')[1] 
                });
                renderImages();
            }
        }

        function convertToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        function renderImages() {
            const container = document.getElementById('imageContainer');
            container.innerHTML = '';
            imagesData.forEach((img, index) => {
                const div = document.createElement('div');
                div.className = 'relative aspect-[3/4] bg-slate-900 rounded-lg overflow-hidden border border-slate-700';
                div.innerHTML = `
                    <img src="data:${img.mimeType};base64,${img.data}" class="w-full h-full object-cover">
                    <button onclick="removeImage(${index})" class="absolute top-2 right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs shadow-md">✕</button>
                    <div class="absolute bottom-0 left-0 right-0 bg-black/70 text-white text-[10px] text-center py-1">Gambar ${index + 1}</div>
                `;
                container.appendChild(div);
            });
        }

        function removeImage(index) {
            imagesData.splice(index, 1);
            renderImages();
        }

        async function generateStory() {
            const btn = document.getElementById('generateBtn');
            const outputSection = document.getElementById('outputSection');
            const resultText = document.getElementById('resultText');
            const loading = document.getElementById('loading');

            if (apiKeys.length === 0) return alert("Silakan tambah minimal 1 API Key terlebih dahulu!");
            if (imagesData.length === 0) return alert("Masukkan setidaknya 1 gambar manga!");

            btn.disabled = true;
            btn.innerHTML = "MEMPROSES...";
            outputSection.classList.remove('hidden');
            resultText.innerHTML = '';
            loading.classList.remove('hidden');

            const promptText = `Kamu adalah pencerita manga yang handal. Saya memberikan beberapa panel gambar komik/manga berurutan. 
            Tugasmu:
            1. Baca dan pahami alur gambar dari KANAN ke KIRI.
            2. Ceritakan adegan tersebut dengan nuansa yang sangat ${currentMood.toUpperCase()}.
            3. Buat persis ${imagesData.length} paragraf cerita (1 gambar = 1 paragraf). Jangan digabung.`;

            const contents = [
                { role: "user", parts: [{ text: promptText }, ...imagesData.map(img => ({ inlineData: { mimeType: img.mimeType, data: img.data } }))] }
            ];

            let success = false;
            let firstErrorMessage = "";

            outerLoop: for (let i = 0; i < apiKeys.length; i++) {
                const currentKey = apiKeys[i];
                for (let j = 0; j < allGeminiModels.length; j++) {
                    const currentModel = allGeminiModels[j];
                    try {
                        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${currentModel}:generateContent?key=${currentKey}`;
                        const response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ contents: contents })
                        });

                        const data = await response.json();

                        if (!response.ok) {
                            throw new Error(data.error?.message || `Gagal di model ${currentModel}`);
                        }

                        const story = data.candidates[0].content.parts[0].text;
                        resultText.innerHTML = story.replace(/\n/g, '<br><br>');
                        success = true;
                        
                        addHistory(story, currentModel);
                        break outerLoop; 

                    } catch (error) {
                        if (!firstErrorMessage) {
                            firstErrorMessage = `Model ${currentModel} error: ${error.message}`;
                        }
                    }
                }
            }

            if (!success) {
                resultText.innerHTML = `<div class="p-3 bg-red-900/50 text-red-400 border border-red-800 rounded-lg text-sm shadow-md">
                    <strong>Gagal Terhubung ke Model AI!</strong><br><br>
                    Alasan dari server Google:<br>
                    <em class="text-red-300">${firstErrorMessage}</em><br><br>
                    <strong>Saran:</strong> Coba klik tombol "Uji Key" di atas untuk memeriksa kesehatan API Key Anda.
                </div>`;
            }

            loading.classList.add('hidden');
            btn.disabled = false;
            btn.innerHTML = "🪄 GENERATE CERITA SEKARANG";
        }
    </script>
</body>
</html>
